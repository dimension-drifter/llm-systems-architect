settings:
  orchestrator.sagemaker:
    synchronous: false

parameters:
  finetuning_type: sft
  num_train_epochs: 3
  per_device_train_batch_size: 2
  learning_rate: 3e-4
  dataset_huggingface_workspace: dimension-drifter
  # Dummy runs a tiny slice. Full SFT target: QLoRA NF4, r=16, on ~6k–8k
  # high-density instruct pairs, peak VRAM ~6 GB (see README Overview).
  is_dummy: true # Change this to 'false' to run the training with the full dataset and epochs.
